# https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "estate"
version = "0.1.0"
edition = "2024"
description = "Estate"

[package.metadata.bundle.bin.estate]
name = "Estate"
identifier = "tran.primetimetran.loi"
version = "0.1.0"
copyright = "Copyright © 2026"
category = "Developer Tool"
short_description = "Estate development environment"
long_description = "Estate development environment"
icon = ["assets/icon.icns"]

# https://doc.rust-lang.org/cargo/reference/cargo-targets.html#configuring-a-target
[[bin]]
name = "estate"
path = "src/bin/estate.rs"
required-features = ["native"]

[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["web"]
# target = "wasm32-unknown-unknown"

[[bin]]
name = "native"
path = "src/bin/native.rs"
required-features = ["native"]
# feature = "native"
# target = "aarch64-apple-darwin"
# 1. Run as native
# cargo run --bin native --features=native

[[bin]]
name = "threads"
path = "src/bin/threads.rs"

[[bin]]
name = "macros"
path = "src/bin/macros.rs"

[features]
# This overwrites IDE config causing diagnostics to be wrong given the targetted platform.
#
# To get IDE diagnostics functioning correctly remove the hardcoded default when troubleshooting another build target.
# 
# cargo build --bin web --no-default-features --features="web" --target wasm32-unknown-unknown
# default = ["native"]
# cargo build --bin web --no-default-features --features="web" --target wasm32-unknown-unknown
# default = ["native"]
# Default this this
# default = []
default = ["native"]
# default = ["web"]
mobile = []
web = ["dep:wasm-bindgen", "dep:web-sys", "dep:eframe"]
native = [
  "dep:notify",
  "dep:cli",
  "dep:demand",
  "dep:tokio",
  "dep:rmcp",
  "dep:tower-lsp",
  "dep:tokio-util",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:objc2",
  "dep:core-foundation",
  "dep:core-graphics",
  "dep:signal-hook",
  "dep:comfy-table",
  "dep:jsonschema",
  "dep:tray-icon",
  "dep:egui-winit",
  "dep:macos-accessibility-client",
]

[dependencies]
# Internal
foo.workspace = true
macros-decl.workspace = true
macros-proc.workspace = true
macros.workspace = true
revelation.workspace = true
# External
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs.workspace = true
egui_plot.workspace = true
egui-wgpu.workspace = true
egui.workspace = true
futures.workspace = true
global-hotkey.workspace = true
image.workspace = true
lazy_static.workspace = true
pollster.workspace = true
reqwest.workspace = true
resvg.workspace = true
schemars.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
serde-wasm-bindgen.workspace = true
serde.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
wasm-bindgen-futures.workspace = true
wasm-bridge.workspace = true
wgpu.workspace = true
winit.workspace = true
# Make all these optional so they can be toggled by the native feature
eframe = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
cli = { workspace = true, optional = true }
comfy-table = { workspace = true, optional = true }
core-foundation = { workspace = true, optional = true }
core-graphics = { workspace = true, optional = true }
demand = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }
gloo-timers = { version = "0.4.0", features = ["futures"] }
jsonschema = { workspace = true, optional = true }
macos-accessibility-client = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
signal-hook = { version = "0.4.4", optional = true }
tokio = { workspace = true, optional = true, features = [
  "rt",
  "macros",
] } # Make sure features don't force 'net' on WASM if compiled
tokio-util = { workspace = true, optional = true }
tower-lsp = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }

[build-dependencies]
resvg.workspace = true
