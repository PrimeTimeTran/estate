# Manifest file
## https://doc.rust-lang.org/cargo/reference/manifest.html

# Configuration of Cargo build targets
# https://doc.rust-lang.org/cargo/reference/cargo-targets.html#configuring-a-target
# https://github.com/dandavison/delta

# https://github.com/nowtilous/GutchinTouchTool
# https://github.com/pszypowicz/TrackpadKit
# https://github.com/JitouchApp/Jitouch
# https://github.com/jasonjmcghee/trackpad_haptic
# https://github.com/nowtilous/GutchinTouchTool

# MacOS Geatures
# https://crates.io/crates/winit
#  https://github.com/HuakunShen/monio
#
[package]
name = "estate"
version = "0.1.0"
edition = "2024"
description = "Estate"
autobins = false

[package.metadata.bundle.bin.estate]
name = "Estate"
identifier = "tran.primetimetran.loi"
version = "0.1.0"
copyright = "Copyright © 2026"
category = "Developer Tool"
short_description = "Estate development environment"
long_description = "Estate development environment"
icon = ["assets/icon.icns"]

# Internal bins for document/testing/observing
# abstractions like nightly rust should be prefixed with _ in the bin dir.
#
# These might become seperate crates one day but until we're certain they support estate or aren't rust/prototype examples
# then leave them here so we can easily run & use soruce from the repo.
#
[[bin]]
name = "base"
path = "src/bin/_base.rs"

[[bin]]
name = "mpl"
path = "src/bin/_tmp.rs"

# Bins of Estate or high likelyhood for seperate crate/project
# should be wrapped with [] to identify them clearly. It means we do have some
# concrete idea of how we must have this in the src long term.
#
# Each bin is not only entry point but should be the start of
# documentation of APIs, cli commands, etc.
[[bin]]
# cargo run --bin native --no-default-features --features "native,daemon"
name = "daemon"
path = "src/bin/[daemon].rs"
required-features = ["daemon"]

[[bin]]
name = "native"
path = "src/bin/[native].rs"
required-features = ["native"]

[[bin]]
name = "runner-main"
path = "src/bin/[runner].rs"
required-features = ["native"]

[[bin]]
name = "run"
path = "src/bin/[run].rs"

[[bin]]
name = "settings"
path = "src/bin/settings.rs"
required-features = ["native"]

[[bin]]
name = "server"
path = "src/bin/[server].rs"
required-features = ["native"]

[[bin]]
name = "sdlc"
path = "src/bin/[sdlc].rs"

[[bin]]
name = "web"
path = "src/bin/[web].rs"
required-features = ["web"]
target = "wasm32-unknown-unknown"

# Cargo Features
## https://doc.rust-lang.org/cargo/reference/features.html
[features]
# cargo nextest run --bin settings --test-threads 1 --no-fail-fast

# The default here causes issues with VSCode's Problem Tab.
# It picks up downloaded crates when analyzing

# [PICK 1]
# default = []
# default = ["web"]
default = ["native"]
sdlc = ["native"]
mobile = []
daemon = []
web = [
  "dep:wasm-bindgen",
  "dep:web-sys",
  "dep:eframe",
  "dep:egui_extras",
  "dep:jsonc-parser",
  "dep:tokio-util",
  "dep:js-sys",
]
native = [
  "dep:notify",
  "dep:cli",
  "dep:demand",
  "dep:rmcp",
  "dep:tower-lsp",
  "dep:tokio-util",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:objc2",
  "dep:core-foundation",
  "dep:core-graphics",
  "dep:signal-hook",
  "dep:comfy-table",
  "dep:tray-icon",
  "dep:macos-accessibility-client",
  "dep:egui_extras",
  "dep:jsonc-parser",
]

[dependencies]
# Internal
foo.workspace = true
macros-decl.workspace = true
macros-proc.workspace = true
macros.workspace = true
revelation.workspace = true

# External
anyhow.workspace = true
async-broadcast = "0.7.2"
async-trait.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
global-hotkey.workspace = true
image.workspace = true
lazy_static.workspace = true
owo-colors.workspace = true
pollster.workspace = true
prost-types.workspace = true
prost.workspace = true
rand.workspace = true
reqwest.workspace = true
resvg.workspace = true
schemars.workspace = true
serde-wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
strum = { version = "0.28", features = ["derive"] }
toml.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
wasm-bindgen-futures.workspace = true
wasm-bridge.workspace = true
dotenvy = "0.15.7"
wgpu.workspace = true

# Make all these optional so they can be toggled by the native feature
cli = { workspace = true, optional = true }
comfy-table = { workspace = true, optional = true }
core-foundation = { workspace = true, optional = true }
core-graphics = { workspace = true, optional = true }
demand = { workspace = true, optional = true }
egui_commonmark = { workspace = true }
egui_extras = { workspace = true, optional = true }
jsonc-parser = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
macos-accessibility-client = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
signal-hook = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

# EGUI Family Deps
winit.workspace = true
egui_plot.workspace = true
egui-wgpu.workspace = true
egui.workspace = true
egui-winit.workspace = true
eframe = { workspace = true, optional = true }
tokio-stream = { version = "0.1.19", features = ["sync"] }
axuielement = "0.9.1"
libc.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jev-sdk = { version = "0.1.0", default-features = false }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

inquire = "0.9"
ratatui = "0.30.2"
crossterm = { workspace = true }

objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
tonic = { workspace = true, features = ["transport"] }
tower-lsp = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = "0.4"

[build-dependencies]
prost-build = "0.14.4"
resvg.workspace = true
tonic-build = "0.13.1"

[profile.dev]
# Keep file names/line numbers for panics, but drop full debug info overhead
debug = "line-tables-only" #

[profile.dev.package."*"]
# Compile dependencies with high optimization so your dev binary runs fast,
# while keeping your own application code unoptimized for fast rebuilds
opt-level = 3 #

[lints]
