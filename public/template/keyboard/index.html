<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Estate Keyboard</title>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<section>
			<div class="keyboard">
				<div class="board">
					<div class="row">
						<div class="key" data-key="ESC">Esc</div>
						<div class="key" data-key="1">1 !</div>
						<div class="key" data-key="2">2 @</div>
						<div class="key" data-key="3">3 #</div>
						<div class="key" data-key="4">4 $</div>
						<div class="key" data-key="5">5 %</div>
						<div class="key" data-key="6">6 ^</div>
						<div class="key" data-key="7">7 &</div>
						<div class="key" data-key="8">8 *</div>
						<div class="key" data-key="9">9 (</div>
						<div class="key" data-key="0">0 )</div>
						<div class="key" data-key="-">- _</div>
						<div class="key" data-key="=">= +</div>
						<div class="key backspace" data-key="DELETE">&larr;</div>
					</div>

					<div class="row">
						<div class="key tab" data-key="TAB">&rarrb;</div>
						<div class="key" data-key="Q">Q</div>
						<div class="key" data-key="W">W</div>
						<div class="key" data-key="E">E</div>
						<div class="key" data-key="R">R</div>
						<div class="key" data-key="T">T</div>
						<div class="key" data-key="Y">Y</div>
						<div class="key" data-key="U">U</div>
						<div class="key" data-key="I">I</div>
						<div class="key" data-key="O">O</div>
						<div class="key" data-key="P">P</div>
						<div class="key" data-key="[">[ {</div>
						<div class="key" data-key="]">] }</div>
						<div class="key backslash" data-key="\\">\ |</div>
					</div>

					<div class="row">
						<div class="key caps" data-key="CAPS">&mapstoup;</div>
						<div class="key" data-key="A">A</div>
						<div class="key" data-key="S">S</div>
						<div class="key" data-key="D">D</div>
						<div class="key" data-key="F">F</div>
						<div class="key" data-key="G">G</div>
						<div class="key" data-key="H">H</div>
						<div class="key" data-key="J">J</div>
						<div class="key" data-key="K">K</div>
						<div class="key" data-key="L">L</div>
						<div class="key" data-key=";">; :</div>
						<div class="key" data-key="'">' "</div>
						<div class="key enter" data-key="ENTER">&ldsh;</div>
					</div>

					<div class="row">
						<div class="key lshift" data-key="LSHIFT">&uarr;</div>
						<div class="key" data-key="Z">Z</div>
						<div class="key" data-key="X">X</div>
						<div class="key" data-key="C">C</div>
						<div class="key" data-key="V">V</div>
						<div class="key" data-key="B">B</div>
						<div class="key" data-key="N">N</div>
						<div class="key" data-key="M">M</div>
						<div class="key" data-key=",">, &lt;</div>
						<div class="key" data-key=".">. &gt;</div>
						<div class="key" data-key="/">/ ?</div>
						<div class="key rshift" data-key="RSHIFT">&uarr;</div>
					</div>

					<div class="row">
						<div class="key ctrl" data-key="LCTRL">Ctrl</div>
						<div class="key cmd" data-key="LCMD">Cmd</div>
						<div class="key alt" data-key="LOPT">Alt</div>
						<div class="key space" data-key="SPACE">&mdash;</div>
						<div class="key alt" data-key="ROPT">Alt</div>
						<div class="key menu" data-key="RCMD">Menu</div>
						<div class="key ctrl" data-key="RCTRL">Ctrl</div>
						<div class="key fn" data-key="FN">Fn</div>
					</div>
				</div>
			</div>

			<div class="theme">
				<p>Theme:</p>

				<select>
					<option value="spring">Spring</option>
					<option value="summer">Summer</option>
					<option value="autumn">Autumn</option>
					<option value="winter" selected>Winter</option>
					<option value="custom">Custom</option>
				</select>
			</div>
		</section>

		<script src="main.js"></script>
	</body>
</html>
