<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Page Title Goes Here</title>

		<!-- SEO Metadata -->
		<meta
			name="description"
			content="A brief description of your website content."
		/>
		<meta name="author" content="Your Name" />

		<!-- External Stylesheet -->
		<link rel="stylesheet" href="style.css" />
		<link data-trunk rel="rust" data-bin="estate" />

		<link rel="icon" href="favicon.ico" type="image/x-icon" />
	</head>
	<body>
		<!-- Header / Navigation -->
		<header>

					<li><a href="#contact">Contact</a></li>
				</ul>
			</nav>

		<!-- Main Content Area -->
		<main>
			<section id="hero">
				<h1>Welcome to My Website</h1>
				<p>This is a clean, semantic HTML5 boilerplate template.</p>
			</section>

			<section id="content">
				<h2>About This Project</h2>

			</section>
		</main>

		<!-- Footer -->
		<footer>
			<p>&copy; 2026 Your Company. All rights reserved.</p>
		</footer>
		<script type="module" data-trunk src="public/app.js"></script>
